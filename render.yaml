# Free assessment demo. SQLite resets when Render restarts the service.
services:
  - type: web
    name: compwise-acme
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --include=dev && npm test && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SALARY_DB_PATH
        value: /tmp/compwise/salaries.sqlite3
      - key: DEMO_EPHEMERAL_STORAGE
        value: "true"
